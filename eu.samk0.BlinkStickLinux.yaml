
app-id: eu.samk0.BlinkStickLinux

runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10

build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig
  arch:
    x86_64:
      env:
        RUNTIME: linux-x64

command: BlinkStickLinux

finish-args:
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --device=all
  - --share=ipc
  - --persist=.config/BlinkStickLinux

modules:
  - name: blinkstick-linux
    buildsystem: simple

    build-commands:
      - mkdir -p /app/bin

      - dotnet publish BlinkStickLinux/BlinkStickLinux.csproj
        -c Release
        --runtime $RUNTIME
        --self-contained true
        --source ./nuget-sources
        --source /usr/lib/sdk/dotnet10/nuget/packages
        -p:NuGetAudit=false
        -o /app/bin

      - install -Dm644 BlinkStickLinux/BlinkStickLinux.desktop
        /app/share/applications/eu.samk0.BlinkStickLinux.desktop

      - install -Dm644 BlinkStickLinux/icon.png
        /app/share/icons/hicolor/128x128/apps/eu.samk0.BlinkStickLinux.png

    sources:
      - type: git
        url: https://github.com/sam-k0/BlinkStick.NETCore.git
        branch: master

      - nuget-sources.json
